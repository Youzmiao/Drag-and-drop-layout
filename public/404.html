<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>卡片拖拽应用 - 页面不存在</title>
  <script>
    // 单页应用的GitHub Pages重定向脚本
    // 解决刷新页面404的问题
    var pathSegmentsToKeep = 1; // 仓库名称占一个路径段
    var l = window.location;
    var redirectPath = l.pathname.replace(new RegExp('^\/[^\/]+\/'.repeat(pathSegmentsToKeep)), '/');
    if (redirectPath !== l.pathname) {
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        redirectPath +
        (l.search ? l.search : '') +
        l.hash
      );
    }
  </script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      padding: 50px;
      background: #f8f9fa;
    }
    h1 {
      color: #333;
    }
    p {
      margin: 20px 0;
    }
    a {
      color: #007bff;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>页面未找到</h1>
  <p>您正在寻找的页面可能已经被移除或暂时不可用。</p>
  <p><a href="./">返回首页</a></p>
</body>
</html>
